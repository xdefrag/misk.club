<!doctype html>
<!-- Шаблон афиши 1080x1080. Заполняется скриптом tools/afisha.
     Цвета и шрифт те же, что в docs/style.css. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --green: #2bff80; --black: #000; --white: #fff; --pad: 40px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--black);
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
  }

  /* верх: название во всю ширину, как в шапке сайта */
  .top {
    padding: var(--pad) var(--pad) 0;
    background: var(--green);
    color: var(--black);
    overflow: hidden;
  }
  .title { font-size: 38px; letter-spacing: -.02em; }
  .name {
    margin: 10px 0 -11px -8px;
    font-size: 151px;
    line-height: .8;
    letter-spacing: -.055em;
    white-space: nowrap;
  }

  /* середина: фото */
  .photo {
    min-height: 0;
    border-top: 8px solid var(--black);
    border-bottom: 8px solid var(--black);
    background: var(--black) url("{{PHOTO}}") center / cover no-repeat;
  }

  /* низ: когда и где */
  .bottom {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: end;
    gap: 44px;
    padding: 30px var(--pad) 36px;
    color: var(--white);
  }
  .day {
    margin-left: -10px;
    font-size: 262px;
    line-height: .8;
    letter-spacing: -.06em;
    color: var(--green);
  }
  .when { min-width: 0; padding-bottom: 2px; }
  .weekday { font-size: 44px; letter-spacing: -.02em; }
  .time { margin-top: 6px; font-size: 104px; line-height: .86; letter-spacing: -.045em; }
  .place {
    margin-top: 10px;
    font-size: {{PLACE_SIZE}}px;
    line-height: .95;
    letter-spacing: -.03em;
    overflow-wrap: anywhere;
  }
  .site {
    position: absolute;
    top: var(--pad);
    right: var(--pad);
    font-size: 38px;
    letter-spacing: -.02em;
    text-transform: none;
    color: var(--black);
  }
</style>
</head>
<body>
  <div class="top">
    <p class="title">{{TITLE}}</p>
    <p class="name">Мискатоник</p>
  </div>
  <div class="photo"></div>
  <div class="bottom">
    <p class="day">{{DAY}}</p>
    <div class="when">
      <p class="weekday">{{WEEKDAY}}</p>
      <p class="time">{{TIME}}</p>
      <p class="place">в&nbsp;{{PLACE}}</p>
    </div>
  </div>
  <p class="site">misk.club</p>
</body>
</html>
